<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        /* =========================
           FONTS
           ========================= */

        @font-face {
            font-family: "Unison Pro";
            src: url("unison-pro-bold.otf") format("opentype");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Unison Pro Light";
            src: url("unison-pro-light.otf") format("opentype");
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }


        /* =========================
           GENERAL
           ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #000000;
            overflow: hidden;
        }


        /* =========================
           CENTER IMAGE
           ========================= */

        .home-image {
            position: fixed;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            width: 400px;
            max-width: 70vw;

            transition:
                opacity 0.5s ease,
                transform 0.5s ease;

            z-index: 5;
        }

        .home-image.hidden {
            opacity: 0;

            transform:
                translate(-50%, -50%)
                scale(0.95);

            pointer-events: none;
        }


        /* =========================
           NAVIGATION
           ========================= */

        .navigation {
            position: fixed;

            left: 35px;
            top: 35px;

            display: flex;

            flex-direction: row;

            align-items: center;

            gap: 12px;

            z-index: 100;
        }

        .navigation a {
            position: relative;

            display: inline-block;

            width: fit-content;

            color: #5975A7;

            font-family: "Unison Pro", sans-serif;

            font-size: 13px;

            font-weight: 700;

            letter-spacing: 0.08em;

            text-decoration: none;

            cursor: pointer;

            transition:
                color 0.25s ease,
                transform 0.25s ease,
                text-shadow 0.25s ease;
        }


        /* =========================
           SCRATCH EFFECT
           ========================= */

        .navigation a::before,
        .navigation a::after {

            content: "";

            position: absolute;

            left: -5%;

            width: 110%;

            height: 1px;

            background: #5975A7;

            transform: scaleX(0);

            transform-origin: left center;

            transition:
                transform 0.25s ease;
        }

        .navigation a::before {
            top: 43%;
        }

        .navigation a::after {
            top: 58%;
        }


        /* =========================
           HOVER
           ========================= */

        .navigation a:hover {

            color: #5975A7;

            transform: translateX(4px);

            text-shadow:
                0 0 5px rgba(31, 81, 255, 0.6),
                0 0 15px rgba(31, 81, 255, 0.3);
        }

        .navigation a:hover::before {
            transform: scaleX(1);
        }

        .navigation a:hover::after {
            transform: scaleX(0.8);
        }


        /* =========================
           ACTIVE TAB
           ========================= */

        .navigation a.active::after {
            transform: scaleX(1);
        }

        .navigation a.active::before {
            transform: scaleX(0);
        }


        /* =========================
           SEPARATOR
           ========================= */

        .separator {

            color: #5975A7;

            font-family: Arial, sans-serif;

            font-size: 5px;

            display: flex;

            align-items: center;
        }


        /* =========================
           PAGES
           ========================= */

        .page {

            position: fixed;

            inset: 0;

            display: none;

            padding: 60px;

            color: #5975A7;

            font-family: "Unison Pro", sans-serif;
        }

        .page.active {
            display: block;
        }


        /* =========================
           HALL OF SHAME
           ========================= */

        #shame {

            padding-top: 105px;

            padding-left: 5vw;

            padding-right: 5vw;

            padding-bottom: 80px;

            overflow-y: auto;

            overflow-x: hidden;
        }


        /* TITLE STAYS BOLD */

        .shame-title {

            text-align: center;

            font-family: "Unison Pro", sans-serif;

            font-size: clamp(26px, 3.5vw, 44px);

            font-weight: 700;

            letter-spacing: 0.08em;

            margin-bottom: 50px;
        }


        /* =========================
           GRID
           ========================= */

        .shame-grid {

            width: 100%;

            max-width: 1400px;

            margin: 0 auto;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 30px;

            padding-bottom: 60px;
        }


        /* =========================
           BIG BOX
           ========================= */

        .shame-box {

            min-height: 420px;

            border: 1px solid #5975A7;

            padding: 22px;

            display: flex;

            flex-direction: column;

            justify-content: flex-end;

            background: #000000;
        }


        /* =========================
           NAME BOX
           LIGHT FONT
           ========================= */

        .name-box {

            width: 100%;

            height: 65px;

            border: 1px solid #5975A7;

            background: #000000;

            margin-bottom: 14px;

            display: flex;

            align-items: center;

            padding-left: 18px;

            color: #5975A7;

            font-family: "Unison Pro Light", sans-serif;

            font-weight: 300;

            font-size: 12px;

            letter-spacing: 0.08em;
        }


        /* =========================
           CONTEXT BOX
           LIGHT FONT
           ========================= */

        .context-box {

            width: 100%;

            height: 115px;

            border: 1px solid #5975A7;

            background: #000000;

            display: flex;

            align-items: flex-start;

            padding: 18px;

            color: #5975A7;

            font-family: "Unison Pro Light", sans-serif;

            font-weight: 300;

            font-size: 12px;

            letter-spacing: 0.08em;
        }


        /* =========================
           SCROLLBAR
           ========================= */

        #shame::-webkit-scrollbar {
            width: 8px;
        }

        #shame::-webkit-scrollbar-track {
            background: #000000;
        }

        #shame::-webkit-scrollbar-thumb {
            background: #5975A7;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 850px) {

            #shame {

                padding-left: 25px;

                padding-right: 25px;
            }

            .shame-grid {

                grid-template-columns:
                    repeat(2, 1fr);
            }

            .shame-box {

                min-height: 380px;
            }
        }


        @media (max-width: 520px) {

            .navigation {

                left: 20px;

                top: 25px;
            }

            #shame {

                padding-top: 90px;
            }

            .shame-grid {

                grid-template-columns: 1fr;
            }

            .shame-box {

                min-height: 350px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================
         CENTER IMAGE
         ========================= -->

    <img
        src="image.jpeg"
        class="home-image"
        id="homeImage"
        alt=""
    >


    <!-- =========================
         NAVIGATION
         ========================= -->

    <nav class="navigation">

        <a
            href="#"
            id="shameTab"
            onclick="handleTab('shame', this)"
        >
            Hall Of Shame
        </a>


        <span class="separator">
            ●
        </span>


        <a
            href="#"
            id="socialsTab"
            onclick="handleTab('socials', this)"
        >
            Socials
        </a>

    </nav>


    <!-- =========================
         HALL OF SHAME
         ========================= -->

    <section
        class="page"
        id="shame"
    >

        <h1 class="shame-title">
            HALL OF SHAME
        </h1>


        <div class="shame-grid">


            <!-- BOX 1 -->

            <div class="shame-box">

                <div class="name-box">
                    NAME
                </div>

                <div class="context-box">
                    CONTEXT
                </div>

            </div>


            <!-- BOX 2 -->

            <div class="shame-box">

                <div class="name-box">
                    NAME
                </div>

                <div class="context-box">
                    CONTEXT
                </div>

            </div>


            <!-- BOX 3 -->

            <div class="shame-box">

                <div class="name-box">
                    NAME
                </div>

                <div class="context-box">
                    CONTEXT
                </div>

            </div>


            <!-- BOX 4 -->

            <div class="shame-box">

                <div class="name-box">
                    NAME
                </div>

                <div class="context-box">
                    CONTEXT
                </div>

            </div>


            <!-- BOX 5 -->

            <div class="shame-box">

                <div class="name-box">
                    NAME
                </div>

                <div class="context-box">
                    CONTEXT
                </div>

            </div>


            <!-- BOX 6 -->

            <div class="shame-box">

                <div class="name-box">
                    NAME
                </div>

                <div class="context-box">
                    CONTEXT
                </div>

            </div>


            <!-- BOX 7 -->

            <div class="shame-box">

                <div class="name-box">
                    NAME
                </div>

                <div class="context-box">
                    CONTEXT
                </div>

            </div>


            <!-- BOX 8 -->

            <div class="shame-box">

                <div class="name-box">
                    NAME
                </div>

                <div class="context-box">
                    CONTEXT
                </div>

            </div>


            <!-- BOX 9 -->

            <div class="shame-box">

                <div class="name-box">
                    NAME
                </div>

                <div class="context-box">
                    CONTEXT
                </div>

            </div>


        </div>

    </section>


    <!-- =========================
         SOCIALS
         ========================= -->

    <section
        class="page"
        id="socials"
    >
    </section>


    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script>

        function handleTab(pageName, clickedTab) {

            /*
             * If this tab is already active,
             * return to the home screen.
             */

            if (clickedTab.classList.contains("active")) {

                goHome();

                return;
            }


            /*
             * Otherwise open the selected page.
             */

            openPage(pageName, clickedTab);
        }


        function openPage(pageName, clickedTab) {

            /* Hide center image */

            document
                .getElementById("homeImage")
                .classList.add("hidden");


            /* Hide all pages */

            document
                .querySelectorAll(".page")
                .forEach(function(page) {

                    page.classList.remove("active");

                });


            /* Remove active state */

            document
                .querySelectorAll(".navigation a")
                .forEach(function(tab) {

                    tab.classList.remove("active");

                });


            /* Show selected page */

            document
                .getElementById(pageName)
                .classList.add("active");


            /* Mark selected tab */

            clickedTab.classList.add("active");
        }


        function goHome() {

            /*
             * Show center image again
             */

            document
                .getElementById("homeImage")
                .classList.remove("hidden");


            /*
             * Hide all pages
             */

            document
                .querySelectorAll(".page")
                .forEach(function(page) {

                    page.classList.remove("active");

                });


            /*
             * Remove active underline
             */

            document
                .querySelectorAll(".navigation a")
                .forEach(function(tab) {

                    tab.classList.remove("active");

                });
        }

    </script>

</body>
</html>
