<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        @font-face {
            font-family: "Unison Pro";
            src: url("unison-pro.woff2") format("woff2");
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background:
                radial-gradient(
                    circle at 50% 0%,
                    #ffffff 0%,
                    #fff7fb 25%,
                    #ffd9ea 55%,
                    #f7a8ca 100%
                );
        }

        /* LEFT NAVIGATION */

        .navigation {
            position: fixed;
            left: 35px;
            top: 50%;
            transform: translateY(-50%);

            display: flex;
            flex-direction: column;
            gap: 14px;

            z-index: 10;
        }

        .navigation a {
            position: relative;

            color: #555;
            text-decoration: none;

            font-family: "Unison Pro", Arial, sans-serif;
            font-size: 13px;
            letter-spacing: 0.08em;

            width: fit-content;

            transition:
                color 0.25s ease,
                opacity 0.25s ease;
        }

        /*
        SCRATCH / STRIKE EFFECT
        */

        .navigation a::before,
        .navigation a::after {
            content: "";
            position: absolute;

            left: -4%;
            width: 108%;
            height: 1px;

            background: #555;

            transform: scaleX(0);
            transform-origin: left center;

            transition: transform 0.25s ease;
        }

        .navigation a::before {
            top: 42%;
        }

        .navigation a::after {
            top: 57%;
        }

        /* HOVER */

        .navigation a:hover {
            color: #777;
        }

        .navigation a:hover::before {
            transform: scaleX(1);
        }

        .navigation a:hover::after {
            transform: scaleX(0.82);
        }

        /* Slight movement when hovering */

        .navigation a:hover {
            transform: translateX(3px);
        }
    </style>
</head>

<body>

    <nav class="navigation">

        <a href="#">Hall Of Shame</a>

        <a href="#">Socials</a>

    </nav>

</body>
</html>

</body>
</html>
