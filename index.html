<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background:
                radial-gradient(
                    ellipse at center,
                    #ffffff 0%,
                    #f8f8f8 45%,
                    #eeeeee 100%
                );
            position: relative;
        }

        /* Soft atmospheric glow */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(
                    ellipse at 50% 20%,
                    rgba(255,255,255,0.95),
                    transparent 55%
                );
            pointer-events: none;
        }

        .cloud {
            position: absolute;
            width: 260px;
            height: 75px;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0.95),
                rgba(205,205,205,0.65)
            );
            border-radius: 100px;
            filter: blur(2px);
            box-shadow:
                0 20px 35px rgba(80,80,80,0.12),
                inset 0 -10px 20px rgba(120,120,120,0.12);
            opacity: 0.85;
            animation: drift linear infinite;
        }

        .cloud::before,
        .cloud::after {
            content: "";
            position: absolute;
            background: linear-gradient(
                to bottom,
                #ffffff,
                #d3d3d3
            );
            border-radius: 50%;
        }

        .cloud::before {
            width: 125px;
            height: 125px;
            left: 35px;
            bottom: 15px;
            box-shadow:
                65px 10px 0 10px #eeeeee,
                115px 22px 0 -3px #e4e4e4;
        }

        .cloud::after {
            width: 90px;
            height: 90px;
            left: 125px;
            bottom: 25px;
        }

        .cloud.one {
            top: 12%;
            left: -320px;
            transform: scale(1.1);
            animation-duration: 45s;
        }

        .cloud.two {
            top: 35%;
            left: -400px;
            transform: scale(0.75);
            opacity: 0.6;
            animation-duration: 65s;
            animation-delay: -25s;
        }

        .cloud.three {
            top: 62%;
            left: -350px;
            transform: scale(1.35);
            opacity: 0.5;
            animation-duration: 55s;
            animation-delay: -40s;
        }

        .cloud.four {
            top: 82%;
            left: -300px;
            transform: scale(0.6);
            opacity: 0.45;
            animation-duration: 75s;
            animation-delay: -15s;
        }

        @keyframes drift {
            from {
                left: -350px;
            }

            to {
                left: 110%;
            }
        }
    </style>
</head>

<body>

    <div class="cloud one"></div>
    <div class="cloud two"></div>
    <div class="cloud three"></div>
    <div class="cloud four"></div>

</body>
</html>
