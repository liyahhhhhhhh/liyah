<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        /* =========================
           FONTS
           ========================= */

        @font-face {
            font-family: "Unison Pro";
            src: url("unison-pro-bold.otf") format("opentype");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Unison Pro Light";
            src: url("unison-pro-light.otf") format("opentype");
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }


        /* =========================
           GENERAL
           ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #000000;
            overflow: hidden;
        }


        /* =========================
           START SCREEN
           ========================= */

        .home-content {
            position: fixed;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7vw;

            padding: 40px;

            transition:
                opacity 0.5s ease,
                transform 0.5s ease;

            z-index: 1;
        }

        .home-content.hidden {
            opacity: 0;

            transform: scale(0.97);

            pointer-events: none;
        }


        /* =========================
           HOME IMAGE
           ========================= */

        .home-image {
            width: 400px;

            max-width: 32vw;

            height: auto;

            object-fit: contain;

            transition:
                opacity 0.5s ease,
                transform 0.5s ease;
        }


        /* =========================
           HOME TEXT
           ========================= */

        .home-text {
            display: flex;

            flex-direction: column;

            align-items: flex-start;

            justify-content: center;

            gap: 14px;

            min-width: 350px;
        }

        .welcome-text {
            font-family: "Unison Pro Light", sans-serif;

            font-weight: 300;

            font-size: clamp(20px, 2vw, 30px);

            letter-spacing: 0.08em;

            color: #5975A7;

            transition:
                text-shadow 0.25s ease,
                filter 0.25s ease;
        }

        .hub-text {
            font-family: "Unison Pro", sans-serif;

            font-weight: 700;

            font-size: clamp(35px, 4vw, 62px);

            letter-spacing: 0.06em;

            line-height: 0.95;

            color: #5975A7;

            transition:
                text-shadow 0.25s ease,
                filter 0.25s ease;
        }

        .socials-text {
            font-family: "Unison Pro Light", sans-serif;

            font-weight: 300;

            font-size: clamp(16px, 1.5vw, 22px);

            letter-spacing: 0.08em;

            color: #5975A7;

            margin-top: 12px;

            transition:
                text-shadow 0.25s ease,
                filter 0.25s ease;
        }


        /* =========================
           TEXT HOVER BRIGHTNESS
           ========================= */

        .home-text span:hover,
        .navigation a:hover,
        .name-box:hover,
        .context-box:hover {

            filter: brightness(1.35);

            text-shadow:
                0 0 6px rgba(89, 117, 167, 0.55),
                0 0 16px rgba(89, 117, 167, 0.25);
        }


        /* =========================
           NAVIGATION
           ========================= */

        .navigation {
            position: fixed;

            left: 35px;
            top: 35px;

            display: flex;

            flex-direction: row;

            align-items: center;

            gap: 12px;

            z-index: 100;
        }

        .navigation a {
            position: relative;

            display: inline-block;

            width: fit-content;

            color: #5975A7;

            font-family: "Unison Pro", sans-serif;

            font-size: 13px;

            font-weight: 700;

            letter-spacing: 0.08em;

            text-decoration: none;

            cursor: pointer;

            transition:
                color 0.25s ease,
                transform 0.25s ease,
                text-shadow 0.25s ease,
                filter 0.25s ease;
        }


        /* =========================
           SCRATCH EFFECT
           ========================= */

        .navigation a::before,
        .navigation a::after {

            content: "";

            position: absolute;

            left: -5%;

            width: 110%;

            height: 1px;

            background: #5975A7;

            transform: scaleX(0);

            transform-origin: left center;

            transition:
                transform 0.25s ease;
        }

        .navigation a::before {
            top: 43%;
        }

        .navigation a::after {
            top: 58%;
        }


        /* =========================
           NAVIGATION HOVER
           ========================= */

        .navigation a:hover {

            color: #5975A7;

            transform: translateX(4px);

            filter: brightness(1.35);

            text-shadow:
                0 0 5px rgba(31, 81, 255, 0.6),
                0 0 15px rgba(31, 81, 255, 0.3);
        }

        .navigation a:hover::before {
            transform: scaleX(1);
        }

        .navigation a:hover::after {
            transform: scaleX(0.8);
        }


        /* =========================
           ACTIVE TAB
           ========================= */

        .navigation a.active::after {
            transform: scaleX(1);
        }

        .navigation a.active::before {
            transform: scaleX(0);
        }


        /* =========================
           SEPARATOR
           ========================= */

        .separator {

            color: #5975A7;

            font-family: Arial, sans-serif;

            font-size: 5px;

            display: flex;

            align-items: center;
        }


        /* =========================
           PAGES
           ========================= */

        .page {

            position: fixed;

            inset: 0;

            display: none;

            padding: 60px;

            color: #5975A7;

            font-family: "Unison Pro", sans-serif;
        }

        .page.active {
            display: block;
        }


        /* =========================
           HALL OF SHAME
           ========================= */

        #shame {

            padding-top: 105px;

            padding-left: 5vw;

            padding-right: 5vw;

            padding-bottom: 80px;

            overflow-y: auto;

            overflow-x: hidden;
        }

        .shame-title {

            text-align: center;

            font-family: "Unison Pro", sans-serif;

            font-size: clamp(26px, 3.5vw, 44px);

            font-weight: 700;

            letter-spacing: 0.08em;

            margin-bottom: 50px;
        }


        /* =========================
           GRID
           ========================= */

        .shame-grid {

            width: 100%;

            max-width: 1400px;

            margin: 0 auto;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 30px;

            padding-bottom: 60px;
        }


        /* =========================
           BIG BOXES
           ========================= */

        .shame-box {

            min-height: 420px;

            border: 1px solid #5975A7;

            padding: 22px;

            display: flex;

            flex-direction: column;

            justify-content: flex-end;

            background: #000000;
        }


        /* =========================
           NAME BOX
           ========================= */

        .name-box {

            width: 100%;

            height: 65px;

            border: 1px solid #5975A7;

            background: #000000;

            margin-bottom: 14px;

            display: flex;

            align-items: center;

            padding-left: 18px;

            color: #5975A7;

            font-family: "Unison Pro Light", sans-serif;

            font-weight: 300;

            font-size: 12px;

            letter-spacing: 0.08em;

            transition:
                filter 0.25s ease,
                text-shadow 0.25s ease;
        }


        /* =========================
           CONTEXT BOX
           ========================= */

        .context-box {

            width: 100%;

            height: 115px;

            border: 1px solid #5975A7;

            background: #000000;

            display: flex;

            align-items: flex-start;

            padding: 18px;

            color: #5975A7;

            font-family: "Unison Pro Light", sans-serif;

            font-weight: 300;

            font-size: 12px;

            letter-spacing: 0.08em;

            transition:
                filter 0.25s ease,
                text-shadow 0.25s ease;
        }


        /* =========================
           SCROLLBAR
           ========================= */

        #shame::-webkit-scrollbar {
            width: 8px;
        }

        #shame::-webkit-scrollbar-track {
            background: #000000;
        }

        #shame::-webkit-scrollbar-thumb {
            background: #5975A7;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 850px) {

            .home-content {
                gap: 35px;
            }

            .home-image {
                max-width: 38vw;
            }

            .home-text {
                min-width: 0;
            }

            #shame {
                padding-left: 25px;
                padding-right: 25px;
            }

            .shame-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .shame-box {
                min-height: 380px;
            }
        }


        @media (max-width: 600px) {

            .home-content {

                flex-direction: column;

                gap: 30px;

                text-align: center;
            }

            .home-image {

                max-width: 60vw;

                width: 300px;
            }

            .home-text {

                align-items: center;
            }

            .navigation {

                left: 20px;

                top: 25px;
            }

            #shame {

                padding-top: 90px;
            }

            .shame-grid {

                grid-template-columns: 1fr;
            }

            .shame-box {

                min-height: 350px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================
         START SCREEN
         ========================= -->

    <div
        class="home-content"
        id="homeContent"
    >

        <img
            src="image.jpeg"
            class="home-image"
            alt=""
        >


        <div class="home-text">

            <span class="welcome-text">
                Welcome to
            </span>

            <span class="hub-text">
                liyah's hub
            </span>

            <span class="socials-text">
                check out liyah's socials:
            </span>

        </div>

    </div>


    <!-- =========================
         NAVIGATION
         ========================= -->

    <nav class="navigation">

        <a
            href="#"
            id="shameTab"
            onclick="handleTab('shame', this, event)"
        >
            Hall Of Shame
        </a>


        <span class="separator">
            ●
        </span>


        <a
            href="#"
            id="socialsTab"
            onclick="handleTab('socials', this, event)"
        >
            Socials
        </a>

    </nav>


    <!-- =========================
         HALL OF SHAME
         ========================= -->

    <section
        class="page"
        id="shame"
    >

        <h1 class="shame-title">
            HALL OF SHAME
        </h1>


        <div class="shame-grid">


            <div class="shame-box">
                <div class="name-box">NAME</div>
                <div class="context-box">CONTEXT</div>
            </div>


            <div class="shame-box">
                <div class="name-box">NAME</div>
                <div class="context-box">CONTEXT</div>
            </div>


            <div class="shame-box">
                <div class="name-box">NAME</div>
                <div class="context-box">CONTEXT</div>
            </div>


            <div class="shame-box">
                <div class="name-box">NAME</div>
                <div class="context-box">CONTEXT</div>
            </div>


            <div class="shame-box">
                <div class="name-box">NAME</div>
                <div class="context-box">CONTEXT</div>
            </div>


            <div class="shame-box">
                <div class="name-box">NAME</div>
                <div class="context-box">CONTEXT</div>
            </div>


            <div class="shame-box">
                <div class="name-box">NAME</div>
                <div class="context-box">CONTEXT</div>
            </div>


            <div class="shame-box">
                <div class="name-box">NAME</div>
                <div class="context-box">CONTEXT</div>
            </div>


            <div class="shame-box">
                <div class="name-box">NAME</div>
                <div class="context-box">CONTEXT</div>
            </div>


        </div>

    </section>


    <!-- =========================
         SOCIALS
         ========================= -->

    <section
        class="page"
        id="socials"
    >
    </section>


    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script>

        function handleTab(pageName, clickedTab, event) {

            event.preventDefault();


            /* If already inside this tab,
               return to home */

            if (clickedTab.classList.contains("active")) {

                goHome();

                return;
            }


            openPage(pageName, clickedTab);
        }


        function openPage(pageName, clickedTab) {

            /* Hide start screen */

            document
                .getElementById("homeContent")
                .classList.add("hidden");


            /* Hide every page */

            document
                .querySelectorAll(".page")
                .forEach(function(page) {

                    page.classList.remove("active");

                });


            /* Remove active tab */

            document
                .querySelectorAll(".navigation a")
                .forEach(function(tab) {

                    tab.classList.remove("active");

                });


            /* Open selected page */

            document
                .getElementById(pageName)
                .classList.add("active");


            /* Underline selected tab */

            clickedTab.classList.add("active");
        }


        function goHome() {

            /* Show start screen */

            document
                .getElementById("homeContent")
                .classList.remove("hidden");


            /* Hide pages */

            document
                .querySelectorAll(".page")
                .forEach(function(page) {

                    page.classList.remove("active");

                });


            /* Remove tab underlines */

            document
                .querySelectorAll(".navigation a")
                .forEach(function(tab) {

                    tab.classList.remove("active");

                });
        }

    </script>

</body>
</html>
