<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        @font-face {
            font-family: "Unison Pro";
            src: url("unison-pro-bold.otf") format("opentype");
            font-weight: 700;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #000000;
            color: #1F51FF;
        }

        /* LEFT NAVIGATION */

        .navigation {
            position: fixed;
            left: 35px;
            top: 50%;
            transform: translateY(-50%);

            display: flex;
            flex-direction: column;
            gap: 14px;

            z-index: 10;
        }

        .navigation a {
            position: relative;

            color: #1F51FF;
            text-decoration: none;

            font-family: "Unison Pro", sans-serif;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.08em;

            width: fit-content;

            transition:
                color 0.25s ease,
                transform 0.25s ease;
        }

        /* SCRATCH EFFECT */

        .navigation a::before,
        .navigation a::after {
            content: "";
            position: absolute;

            left: -4%;
            width: 108%;
            height: 1px;

            background: #1F51FF;

            transform: scaleX(0);
            transform-origin: left center;

            transition: transform 0.25s ease;
        }

        .navigation a::before {
            top: 42%;
        }

        .navigation a::after {
            top: 57%;
        }

        /* HOVER */

        .navigation a:hover {
            color: #135E77;
            transform: translateX(3px);

            text-shadow:
                0 0 5px rgba(31, 81, 255, 0.6),
                0 0 12px rgba(31, 81, 255, 0.25);
        }

        .navigation a:hover::before {
            transform: scaleX(1);
        }

        .navigation a:hover::after {
            transform: scaleX(0.82);
        }
    </style>
</head>

<body>

    <nav class="navigation">
        <a href="#">Hall Of Shame</a>
        <a href="#">Socials</a>
    </nav>

</body>
</html>
